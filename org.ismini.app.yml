app-id: org.ismini.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ismini
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=host
  - --talk-name=org.freedesktop.ScreenCast
  - --talk-name=org.freedesktop.portal.ScreenCast
  - --talk-name=org.freedesktop.portal.Background

modules:
  # 1. Node.js 22 LTS (bundled — no system dependency needed)
  - name: nodejs
    buildsystem: simple
    build-commands: []
    sources:
      - type: archive
        url: https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
        sha256: 69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec
        only-architectures: [x86_64]
    # For flatpak-builder 1.4.8: use 'build-commands' to install into /app
    build-options:
      no-pkgconfig-path: true
    post-install:
      - mkdir -p /app/bin /app/lib /app/include
      - cp bin/node /app/bin/
      - cp bin/npx /app/bin/
      - cp bin/corepack /app/bin/
      - cp -r lib/* /app/lib/
      - cp -r include/* /app/include/
      - chmod +x /app/bin/node /app/bin/npx /app/bin/corepack

  # 2. Ismini application
  - name: ismini
    buildsystem: simple
    build-commands:
      - install -Dm755 ismini /app/bin/ismini
      - install -Dm644 agent.js /app/lib/ismini/agent.js
      - install -Dm644 web.js /app/lib/ismini/web.js
      - install -Dm644 config.json /app/lib/ismini/config.json
      - install -Dm644 ismini.png /app/share/icons/hicolor/256x256/apps/org.ismini.app.png
      - install -Dm644 ismini.desktop /app/share/applications/org.ismini.app.desktop
      - install -Dm644 web/index.html /app/lib/ismini/web/index.html
      - install -Dm644 web/favicon-256.png /app/lib/ismini/web/favicon-256.png
      - install -Dm644 web/marble.jpeg /app/lib/ismini/web/marble.jpeg
      - install -Dm644 web/stars.gif /app/lib/ismini/web/stars.gif
      - install -Dm644 web/bg.jpg /app/lib/ismini/web/bg.jpg
      - cp -r web/fonts /app/lib/ismini/web/fonts
      - cp -r tools /app/lib/ismini/tools
    sources:
      - type: dir
        path: .
