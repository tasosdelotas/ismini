<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ismini</title>
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png?v=2">
<style>
  :root {
    --bg: #0f1318;
    --panel: #161c23;
    --panel2: #1b232c;
    --border: #2a333d;
    --text: #d8dee6;
    --dim: #8b949e;
    --user: #3fb950;
    --model: #58a6ff;
    --tool: #bc8cff;
    --warn: #e3b341;
    --err: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #1a2230 0%, var(--bg) 70%);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* 4. Text selection */
  ::selection { background: rgba(88, 166, 255, .25); color: var(--text); }

  /* 3. Custom scrollbar */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--dim); }

  /* 10. Focus-visible ring */
  :focus-visible {
    outline: 2px solid rgba(88, 166, 255, .6);
    outline-offset: 2px;
    border-radius: 4px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font: 700 15px/1 var(--mono);
    letter-spacing: .12em;
    color: var(--warn);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--err);
    box-shadow: 0 0 8px currentColor;
    transition: background .3s;
  }
  .dot.on { background: var(--user); }
  .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #modelBadge {
    font: 12px/1 var(--mono);
    color: #7ecf7e;
    background: rgba(100,200,100,.08);
    border: 1px solid rgba(100,200,100,.35);
    border-radius: 20px;
    padding: 4px 10px;
    max-width: 46vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #status {
    margin-left: auto;
    font: 12px/1.4 var(--mono);
    color: var(--dim);
    white-space: nowrap;
  }
  #status.active {
    display: inline-block;
    padding: 5px 12px;
    border: 1px solid rgba(255,170,50,.5);
    border-radius: 8px;
    background: rgba(255,170,50,.1);
    color: #ffb347;
    font-weight: 600;
    animation: statusPulse 1.2s ease-in-out infinite;
  }
  @keyframes statusPulse {
    0%, 100% { border-color: rgba(255,170,50,.5); }
    50% { border-color: rgba(255,170,50,.9); background: rgba(255,170,50,.18); }
  }
  #newBtn {
    background: rgba(88,166,255,.12);
    border-color: rgba(88,166,255,.4);
    color: var(--model);
    font-weight: 600;
  }
  #newBtn:hover:not(:disabled) { background: rgba(88,166,255,.22); }
  button {
    font: 13px/1 inherit;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--dim); }
  button:disabled { opacity: .45; cursor: default; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 0 8px;
    scroll-behavior: smooth;
  }
  .inner { max-width: 860px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }

  /* 1. Message entrance animation */
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg { display: flex; animation: msgIn .18s ease-out; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 12px; overflow-wrap: break-word; }
  .msg.user .bubble {
    background: rgba(63, 185, 80, .12);
    border: 1px solid rgba(63, 185, 80, .35);
    border-bottom-right-radius: 4px;
  }
  .msg.model .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    max-width: 88%;
  }
  .who {
    font: 11px/1 var(--mono);
    color: var(--dim);
    letter-spacing: .08em;
    margin-bottom: 5px;
    display: flex; gap: 6px; align-items: center;
  }
  .who .avatar {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .who .avatar-user {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    opacity: .7;
  }

  /* 6. Timestamps */
  .timestamp {
    font: 10.5px/1 var(--mono);
    color: var(--dim);
    opacity: .6;
    margin-top: 6px;
    text-align: right;
  }
  .msg.user .timestamp { text-align: left; }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h4 { margin: 10px 0 6px; font-size: 14px; color: var(--text); }
  .bubble ul { margin: 4px 0 8px; padding-left: 20px; }
  .bubble code {
    font: 12.5px/1.4 var(--mono);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    color: #c9d4e0;
  }
  .bubble pre.code {
    background: #0b0f14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 6px 0 10px;
    overflow-x: auto;
    font: 12.5px/1.5 var(--mono);
    position: relative;
  }
  .bubble pre.code code { border: 0; padding: 0; background: none; }
  .bubble a { color: var(--model); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble .trow { font: 12.5px/1.5 var(--mono); color: var(--dim); }

  /* 2. Copy button on code blocks */
  .copy-btn {
    position: absolute;
    top: 6px; right: 6px;
    font: 11px/1 var(--mono);
    color: var(--dim);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s, border-color .15s;
  }
  pre.code:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { border-color: var(--dim); color: var(--text); }
  .copy-btn.copied { color: var(--user); border-color: rgba(63,185,80,.4); }

  .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--model);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .toolcard {
    max-width: 88%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--tool);
    border-radius: 10px;
    overflow: hidden;
    animation: msgIn .18s ease-out;
  }
  .toolcard summary {
    cursor: pointer;
    list-style: none;
    padding: 8px 12px;
    font: 12.5px/1.4 var(--mono);
    color: var(--tool);
    display: flex;
    gap: 8px;
    align-items: center;
    user-select: none;
  }
  .toolcard summary::-webkit-details-marker { display: none; }
  .toolcard summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
  .toolcard[open] summary::before { transform: rotate(90deg); }
  /* 11. Tool card icon */
  .toolcard .tool-icon {
    font-size: 13px;
    flex-shrink: 0;
    line-height: 1;
  }
  .toolcard pre {
    margin: 0;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: #0b0f14;
    font: 12px/1.5 var(--mono);
    color: #aab6c2;
    max-height: 320px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .banner {
    max-width: 88%;
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 13.5px;
    border: 1px solid;
    animation: msgIn .18s ease-out;
  }
  .banner.warn { color: var(--warn); border-color: rgba(227,179,65,.4); background: rgba(227,179,65,.08); }
  .banner.error { color: var(--err); border-color: rgba(248,81,73,.45); background: rgba(248,81,73,.08); }

  .empty {
    margin: 12vh auto 0;
    text-align: center;
    color: var(--dim);
  }
  /* 7. Empty state icon */
  .empty .icon {
    width: 48px; height: 48px;
    margin: 0 auto 16px;
    opacity: .6;
  }
  .empty .big { font: 700 22px/1.2 var(--mono); letter-spacing: .18em; color: var(--warn); margin-bottom: 10px; }
  .empty p { font-size: 13.5px; max-width: 420px; margin: 4px auto; }
  .empty kbd {
    font: 12px var(--mono);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
  }

  footer { padding: 10px 16px 14px; background: linear-gradient(to top, var(--bg) 70%, transparent); position: relative; }
  .composer {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 8px 8px 14px;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--model); }
  #input {
    flex: 1;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font: 14.5px/1.5 inherit;
    max-height: 160px;
    padding: 4px 0;
  }
  #input::placeholder { color: #57606a; }
  #sendBtn {
    background: rgba(88,166,255,.12);
    border-color: rgba(88,166,255,.4);
    color: var(--model);
    font-weight: 600;
    padding: 8px 16px;
    min-width: 72px;
    justify-content: center;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #sendBtn:hover:not(:disabled) { background: rgba(88,166,255,.22); }

  #pauseBtn {
    background: rgba(255,170,50,.12);
    border-color: rgba(255,170,50,.5);
    color: #ffb347;
    font-weight: 600;
    padding: 8px 14px;
  }
  #pauseBtn:hover:not(:disabled) { background: rgba(255,170,50,.25); }

  /* 8. Send button loading dots */
  .send-dots { display: inline-flex; gap: 3px; }
  .send-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--model);
    animation: dotBounce .6s infinite alternate;
  }
  .send-dots span:nth-child(2) { animation-delay: .15s; }
  .send-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dotBounce { to { transform: translateY(-3px); opacity: .4; } }

  /* 5. Scroll-to-bottom button */
  .scroll-bottom-btn {
    position: absolute;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--dim);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s, border-color .15s;
    z-index: 5;
  }
  .scroll-bottom-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .scroll-bottom-btn:hover { border-color: var(--dim); color: var(--text); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%) translateY(8px);
    background: var(--panel2);
    border: 1px solid var(--err);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 9;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="logo">ISMINI</span>
    <span id="modelBadge" title="model endpoint">…</span>
    <span id="status"></span>
    <button id="newBtn" title="Start a new conversation">New chat</button>
  </header>

  <main id="scroll">
    <div class="inner" id="chat"></div>
  </main>

  <footer>
    <button class="scroll-bottom-btn" id="scrollBtn" title="Scroll to latest">↓</button>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message ismini…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="pauseBtn" title="Pause — type a suggestion to redirect" style="display:none">⏸ Pause</button>
      <button id="sendBtn">Send</button>
    </div>
  </footer>

  <div id="toast"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), input = $("input"), sendBtn = $("sendBtn"),
        newBtn = $("newBtn"), dot = $("dot"), badge = $("modelBadge"),
        statusEl = $("status"), toastEl = $("toast"), scroll = $("scroll"),
        scrollBtn = $("scrollBtn"), pauseBtn = $("pauseBtn");

  let busy = false;
  let liveBubble = null;   // streaming model bubble
  let liveText = "";
  let toastTimer = null;

  // ── helpers ─────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  const stripAnsi = (s) => s.replace(/\x1b\[[0-9;]*m/g, "");

  function inline(s) {
    let out = esc(s);
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return out;
  }

  // small markdown renderer: fences, inline code, bold, links, headings, lists
  function renderMd(src) {
    const lines = stripAnsi(String(src)).replace(/\r\n/g, "\n").split("\n");
    let html = "", inCode = false, codeBuf = [], listBuf = [];
    const flushList = () => {
      if (listBuf.length) {
        html += "<ul>" + listBuf.map((li) => "<li>" + inline(li) + "</li>").join("") + "</ul>";
        listBuf = [];
      }
    };
    for (const raw of lines) {
      const t = raw.trim();
      if (!inCode && /^```/.test(t)) { inCode = true; codeBuf = []; continue; }
      if (inCode) {
        if (/^```/.test(t)) {
          inCode = false;
          html += '<pre class="code"><code>' + esc(codeBuf.join("\n")) + "</code></pre>";
        } else codeBuf.push(raw);
        continue;
      }
      if (/^[-*] /.test(t) || /^\d+\. /.test(t)) {
        listBuf.push(t.replace(/^([-*]|\d+\. )/, ""));
        continue;
      }
      flushList();
      if (!t) continue;
      if (/^#{1,4} /.test(t)) html += "<h4>" + inline(t.replace(/^#{1,4} /, "")) + "</h4>";
      else if (/^\|.*\|$/.test(t)) html += '<div class="trow">' + inline(t) + "</div>";
      else html += "<p>" + inline(t) + "</p>";
    }
    if (inCode && codeBuf.length) html += '<pre class="code"><code>' + esc(codeBuf.join("\n")) + "</code></pre>";
    flushList();
    return html;
  }

  // 6. Timestamp helper
  function ts() {
    const d = new Date();
    return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
  }

  // 2. Add copy buttons to all code blocks in a container
  function addCopyButtons(container) {
    container.querySelectorAll("pre.code").forEach((pre) => {
      if (pre.querySelector(".copy-btn")) return; // already added
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "copy";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const code = pre.querySelector("code");
        const text = code ? code.textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(() => {
          btn.textContent = "copied!";
          btn.classList.add("copied");
          setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
        });
      });
      pre.appendChild(btn);
    });
  }

  // ── DOM builders ────────────────────────────────────────────────
  function scrollBottom() { scroll.scrollTop = scroll.scrollHeight; }

  const USER_AVATAR = '<svg class="avatar-user" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="5" r="3" fill="var(--user)"/><path d="M2.5 14c0-2.5 2.5-4 5.5-4s5.5 1.5 5.5 4" fill="var(--user)" opacity=".6"/></svg>';

  function addUser(text) {
    hideEmpty();
    const el = document.createElement("div");
    el.className = "msg user";
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = '<div class="who">' + USER_AVATAR + '</div>' + renderMd(text) + '<div class="timestamp">' + ts() + '</div>';
    el.appendChild(b);
    chat.appendChild(el);
    addCopyButtons(b);
    scrollBottom();
    return el;
  }

  function addModel(text, streaming) {
    hideEmpty();
    const el = document.createElement("div");
    el.className = "msg model";
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML =
      '<div class="who"><img class="avatar" src="/favicon-256.png" alt=""> ISMINI</div>' +
      renderMd(text) +
      (streaming ? '<span class="cursor"></span>' : '<div class="timestamp">' + ts() + '</div>');
    el.appendChild(b);
    chat.appendChild(el);
    addCopyButtons(b);
    scrollBottom();
    return b;
  }

  // 11. Tool icon SVG
  const TOOL_ICON = '<span class="tool-icon">🛠️</span>';

  function addTool(name, result) {
    closeLive();
    hideEmpty();
    const el = document.createElement("details");
    el.className = "toolcard";
    const sum = document.createElement("summary");
    sum.innerHTML = TOOL_ICON + "<span>" + esc(name) + "</span>";
    const pre = document.createElement("pre");
    pre.textContent = stripAnsi(String(result)).slice(0, 20000);
    el.appendChild(sum);
    el.appendChild(pre);
    chat.appendChild(el);
    scrollBottom();
  }

  function addBanner(kind, text) {
    const el = document.createElement("div");
    el.className = "banner " + (kind === "warn" ? "warn" : "error");
    el.textContent = text;
    chat.appendChild(el);
    scrollBottom();
  }

  // 7. Empty state with icon
  function emptyState() {
    if (chat.children.length) return;
    chat.innerHTML =
      '<div class="empty">' +
      '<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="24" cy="24" r="20" stroke="var(--warn)" stroke-width="2" opacity=".4"/>' +
      '<circle cx="24" cy="24" r="4" fill="var(--warn)" opacity=".8"/>' +
      '<path d="M24 8v6M24 34v6M8 24h6M34 24h6" stroke="var(--warn)" stroke-width="2" opacity=".5" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="big">ISMINI</div>' +
      "<p>Your minimal, warm local agent. Files, commands, web — or just talk.</p>" +
      "<p><kbd>Enter</kbd> send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line &nbsp;·&nbsp; tools run automatically</p></div>";
  }
  function hideEmpty() {
    const e = chat.querySelector(".empty");
    if (e) e.remove();
  }

  // ── streaming bubble ────────────────────────────────────────────
  function openLive() {
    if (liveBubble) return;
    liveText = "";
    liveBubble = addModel("", true);
  }
  function closeLive() {
    if (liveBubble) {
      liveBubble.innerHTML =
        '<div class="who"><img class="avatar" src="/favicon-256.png" alt=""> ISMINI</div>' +
        (liveText ? renderMd(liveText) : '<p style="color:var(--dim)">(no text)</p>') +
        '<div class="timestamp">' + ts() + '</div>';
      addCopyButtons(liveBubble);
      liveBubble = null;
      liveText = "";
      scrollBottom();
    }
  }
  function onToken(text) {
    text = stripAnsi(text);
    if (/^[\s─\u2500]*$/.test(text)) return; // terminal box border → skip
    openLive();
    liveText += text;
    liveBubble.innerHTML =
      '<div class="who"><img class="avatar" src="/favicon-256.png" alt=""> ISMINI</div>' +
      renderMd(liveText) + '<span class="cursor"></span>';
    scrollBottom();
  }

  // ── UI state ────────────────────────────────────────────────────
  // 8. Send button loading state
  function setSendBtnState(isBusy) {
    if (isBusy) {
      sendBtn.innerHTML = '<span class="send-dots"><span></span><span></span><span></span></span>';
    } else {
      sendBtn.textContent = "Send";
    }
  }

  function setBusy(v) {
    busy = v;
    dot.classList.toggle("busy", v);
    statusEl.textContent = v ? "busy" : "";
    statusEl.classList.toggle("active", v);
    sendBtn.disabled = v;
    newBtn.disabled = v;
    pauseBtn.style.display = v ? "" : "none";
    pauseBtn.disabled = false;
    setSendBtnState(v);
  }

  pauseBtn.addEventListener("click", async () => {
    pauseBtn.disabled = true;
    pauseBtn.textContent = "…";
    try { await fetch("/pause", { method: "POST" }); }
    catch { pauseBtn.disabled = false; pauseBtn.textContent = "⏸ Pause"; }
  });
  function setModel(id) {
    const short = id ? id.split("/").pop() : "model offline";
    badge.textContent = short;
    badge.title = id ? "loaded model" : "no model detected at the configured endpoint";
    dot.classList.toggle("on", !!id);
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  // 5. Scroll-to-bottom button logic
  function updateScrollBtn() {
    const threshold = 80;
    const distFromBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight;
    scrollBtn.classList.toggle("visible", distFromBottom > threshold);
  }
  scroll.addEventListener("scroll", updateScrollBtn);
  scrollBtn.addEventListener("click", () => { scrollBottom(); });

  // ── actions ─────────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    autosize();
    addUser(text);
    setBusy(true);
    try {
      const r = await fetch("/send", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (r.status === 409) {
        setBusy(true);
        toast("Agent is busy with the previous turn — one moment");
      } else if (!r.ok) {
        setBusy(false);
        const j = await r.json().catch(() => ({}));
        toast(j.error || "send failed (" + r.status + ")");
      }
    } catch (e) {
      setBusy(false);
      toast("network error: " + e.message);
    }
  }

  // Guard: if the tab was backgrounded and we miss the 'done' event, recover
  // from the server state once the user focuses the page again.
  window.addEventListener("focus", async () => {
    if (!busy) return;
    try {
      const r = await fetch("/state");
      const j = await r.json();
      if (!j.busy) setBusy(false);
    } catch { /* server gone; EventSource will retry */ }
  });

  function newChat() {
    if (busy) return;
    closeLive();
    chat.innerHTML = "";
    emptyState();
    fetch("/new", { method: "POST" }).catch(() => {});
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);
  newBtn.addEventListener("click", newChat);

  // ── SSE ─────────────────────────────────────────────────────────
  const es = new EventSource("/events");
  es.addEventListener("message", (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    switch (ev.type) {
      case "hello":
        setModel(ev.model);
        setBusy(ev.busy);
        if (ev.messages > 0) resync();
        break;
      case "token": onToken(ev.text); break;
      case "model": closeLive(); addModel(ev.text); break;
      case "modelSwitch": setModel(ev.id); toast("model switched: " + ev.id); break;
      case "tool": addTool(ev.name, ev.result); break;
      case "warn": addBanner("warn", ev.text); break;
      case "error": closeLive(); addBanner("error", ev.text); break;
      case "done": closeLive(); setBusy(false); break;
      case "paused":
        closeLive();
        setBusy(false);
        statusEl.textContent = "paused — type a suggestion";
        statusEl.classList.add("active");
        input.focus();
        break;
      case "reset": closeLive(); chat.innerHTML = ""; emptyState(); break;
    }
  });
  es.onopen = () => dot.classList.add("on");
  es.onerror = () => {
    dot.classList.remove("on", "busy");
    statusEl.textContent = "reconnecting…";
  };

  // after a reconnect, rebuild the conversation from the server's session
  async function resync() {
    try {
      const r = await fetch("/transcript");
      const j = await r.json();
      closeLive();
      chat.innerHTML = "";
      emptyState();
      for (const m of j.messages || []) {
        if (m.role === "user") addUser(m.content);
        else if (m.role === "assistant") {
          if (m.tools) m.tools.forEach((t) => addTool(t, "(ran)"));
          if (m.content) addModel(m.content);
        } else if (m.role === "tool") addTool(m.name || "tool", m.content);
      }
      setBusy(false);
    } catch { /* server gone; EventSource will retry */ }
  }

  emptyState();
  input.focus();
})();
</script>
</body>
</html>
